name: CheatCode macOS MVP

on:
  workflow_dispatch:
    inputs:
      full_cmux:
        description: Also build the full cmux fork with its embedded terminal
        type: boolean
        default: true
  push:
    branches: [personal/native-ssh-chat]
    paths:
      - 'Sources/PersonalChat/**'
      - 'Sources/cmuxApp.swift'
      - 'personal/**'
      - '.github/workflows/personal-macos.yml'
      - 'scripts/build-app-bundled-resources.sh'
      - 'Resources/Localizable.xcstrings'
      - 'cmux.xcodeproj/project.pbxproj'

permissions:
  contents: read

concurrency:
  group: personal-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s personal/tests -v

  native-preview:
    needs: bridge-tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: bash personal/scripts/test-startup.sh
      - run: bash personal/scripts/test-microphone-callback.sh
      - run: bash personal/scripts/build-preview.sh artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CheatCode-macos-arm64
          path: artifact/CheatCode-macos.zip
          retention-days: 14

  full-cmux:
    if: github.event_name == 'push' || inputs.full_cmux
    needs: bridge-tests
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CMUX_DEV_BACKEND_MODE: local
      CMUX_SKIP_ZIG_BUILD: '1'
      CMUX_GHOSTTYKIT_PREPROVISIONED: '1'
      CMUX_SOURCE_PACKAGES_DIR: ${{ github.workspace }}/.personal-source-packages
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 200
          persist-credentials: false
      - name: Select the upstream Xcode major
        run: CMUX_CI_MAX_MACOS_SDK_MAJOR=26 ./scripts/select-ci-xcode.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Provision upstream native dependencies
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh
      - name: Verify the matching upstream terminal client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          client_commit="$(scripts/ci/resolve-cmux-tui-client-commit.sh)"
          git diff --exit-code "$client_commit" HEAD -- cmux-tui ghostty
          client_bundle="$RUNNER_TEMP/cmux-personal-tui"
          mkdir -p "$client_bundle/Contents"
          scripts/install-cmux-tui-client.sh "$client_bundle" \
            --manifest-url "https://files.cmux.com/cmux-tui/$client_commit/manifest.json" \
            --expected-commit "$client_commit" --require-capability wireguard-hub \
            --attest-signer-workflow 'manaflow-ai/cmux/.github/workflows/cmux-tui-artifacts.yml'
          echo "CMUX_TUI_CLIENT_LOCAL=$client_bundle/Contents/Resources/bin/cmux-tui" >> "$GITHUB_ENV"
      - name: Apply personal app branding
        run: personal/scripts/apply-personal-branding.sh
      - name: Build the isolated personal fork
        run: |
          set -euo pipefail
          ./scripts/reload.sh --tag personal --derived-data "$RUNNER_TEMP/cmux-personal-build" \
            --swift-frontend-workaround 2>&1 | tee "$RUNNER_TEMP/personal-build.log"
          app_path="$(awk '/^App path:/{getline; sub(/^  /, ""); print; exit}' "$RUNNER_TEMP/personal-build.log")"
          test -d "$app_path"
          test -f "$app_path/Contents/Resources/personal-bridge.py"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "$app_path" artifact/cmux-personal-macos.zip
          git archive --format=tar.gz --output=artifact/cmux-personal-source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cmux-personal-full-arm64
          path: artifact/
          retention-days: 14
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cmux-personal-build-log
          path: ${{ runner.temp }}/personal-build.log
          if-no-files-found: ignore
